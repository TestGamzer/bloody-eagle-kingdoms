<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مملكة النسر الدامي - ثغور الأندلس</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110b;--pan:#211b10;--ln:#6b5a2e;--gd:#e2b84a;--tx:#f1e8cf;--ol:#6f8238;--rd:#8b1d1d;--ok:#2d6a4f}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',Tahoma,sans-serif;overflow:hidden}
h1,h2,h3{font-family:'Amiri',serif;color:var(--gd);margin:0}
#top{display:flex;justify-content:space-around;gap:10px;padding:8px 12px;background:#0c0a06;border-bottom:2px solid var(--gd);font-size:.95rem;font-weight:700}
#map{flex:1;overflow:auto;position:relative;background:#1e1a12}
.panel{background:var(--pan);border-top:2px solid var(--gd);padding:15px;max-height:35vh;overflow-y:auto}
.btn{background:var(--ol);color:#fff;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700}
.btn:hover{background:#7e943f}
.btn.gd{background:var(--gd);color:#14110b}
.btn.rd{background:var(--rd)}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
</style>
</head>
<body>

<div id="top">
  <div>القلعة: <span id="s_lvl">30</span>/30</div>
  <div>الذهب: <span id="s_gold">10.2M</span></div>
  <div>الخشب: <span id="s_wood">5.9M</span></div>
  <div>الحجر: <span id="s_inch">2.3M</span></div>
  <div>القمح: <span id="s_food">14.5M</span></div>
</div>

<div id="map">
  <div style="padding:40px;text-align:center;">
    <h2>خريطة ثغور الأندلس - مملكة النسر الدامي</h2>
    <p style="color:#bfa878;margin-top:10px;">النظام الموحد للممالك يعمل بنجاح تامن وتحديث الموارد حي ومستمر.</p>
    <div style="margin-top:20px;">
      <button class="btn gd" onclick="alert('قلعتك الحصينة تؤمن الحدود!')">تفقد القلعة</button>
      <button class="btn" onclick="trainTroops()">تدريب حامية جديدة (+50 جندي)</button>
    </div>
  </div>
</div>

<div class="panel">
  <div class="row">
    <h3>إدارة المملكة والجيش</h3>
    <span style="font-size:.85rem;color:var(--gd);">الجنود: <span id="s_sol">250</span></span>
  </div>
  <p id="log" style="font-size:.9rem;color:#d4c49d;margin:0;">أهلاً بك يا مولاي في مملكة النسر الدامي. الموارد تتولد تلقائياً كل ثانية.</p>
</div>

<script>
const S = {lvl:30, gold:10200000, wood:5900000, inch:2300000, food:14500000, soldiers:250};
function updateUI(){
  document.getElementById('s_lvl').innerText = S.lvl;
  document.getElementById('s_gold').innerText = (S.gold/1e6).toFixed(1) + 'M';
  document.getElementById('s_wood').innerText = (S.wood/1e6).toFixed(1) + 'M';
  document.getElementById('s_inch').innerText = (S.inch/1e6).toFixed(1) + 'M';
  document.getElementById('s_food').innerText = (S.food/1e6).toFixed(1) + 'M';
  document.getElementById('s_sol').innerText = S.soldiers;
}
function trainTroops(){
  S.soldiers += 50;
  S.gold -= 5000;
  document.getElementById('log').innerText = "تم تدريب 50 جندياً إضافياً بنجاح لدعم حامية الثغور!";
  updateUI();
}
// حلقة توليد الموارد التلقائية
setInterval(()=>{
  S.gold += 1500;
  S.wood += 1000;
  S.inch += 800;
  S.food += 1200;
  updateUI();
}, 1000);
updateUI();
</script>

</body>
</html>
