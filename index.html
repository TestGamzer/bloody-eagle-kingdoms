<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>ثغور الأندلس - القاعدة</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110b;--pan:#211b10;--ln:#6b5a2e;--gd:#e2b84a;--tx:#f1e8cf;--ol:#6f8f3a;--rd:#c0453a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;display:flex;flex-direction:column}
h3{font-family:Amiri,serif;color:var(--gd);margin:.2rem 0 .5rem;font-size:1.25rem}
#top{display:flex;gap:10px;padding:6px 10px;background:#0c0a06;border-bottom:1px solid var(--ln);font-size:.85rem;flex-wrap:wrap}
#top b{color:var(--gd)}
#mapbox{flex:1 1 52%;overflow:auto;position:relative;min-height:0;border-bottom:2px solid var(--ln)}
#map{position:relative;width:max(100%,920px);aspect-ratio:1672/941}
#map img,#map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pin{position:absolute;transform:translate(50%,-50%);min-width:26px;height:26px;padding:0 6px;border-radius:13px;border:2px solid #fff;color:#fff;font:700 .75rem Cairo;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 8px #000}
.pin.monster{background:#8b1d1d}.pin.rebel{background:#3a3a3a;border-color:#e2b84a}.pin.city{background:#2d5a1e}.pin.me{background:var(--gd);color:#000;border-color:#000;width:auto}
.pin.sel{outline:3px solid var(--gd)}
.dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--gd);border:2px solid #000;transform:translate(50%,-50%);pointer-events:none}
#panel{flex:1 1 48%;min-height:0;display:flex;flex-direction:column;background:var(--pan)}
#tabs{display:flex;border-bottom:1px solid var(--ln)}
#tabs button{flex:1;padding:9px 2px;background:none;border:0;color:var(--tx);font:700 .95rem Cairo;border-bottom:3px solid transparent}
#tabs button.on{color:var(--gd);border-color:var(--gd)}
#body{overflow:auto;padding:10px}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed #3d3320}
.btn{background:var(--ol);color:#fff;border:0;border-radius:6px;padding:9px 14px;font:700 .95rem Cairo;margin:4px 3px 4px 0;cursor:pointer}
.btn.gd{background:var(--gd);color:#1a1405}.btn.rd{background:var(--rd)}.btn:disabled{opacity:.4}
.bar{height:10px;background:#000;border-radius:5px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--gd)}
input,select{background:#0c0a06;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:7px;font:inherit;width:90px}
select{width:auto;max-width:100%}
.bad{color:#ff8a7a}.ok{color:#a7d36a}.mut{color:#a99d7c;font-size:.85rem}
#log{font-size:.82rem;color:#cdbf94;max-height:90px;overflow:auto}
</style></head><body>
