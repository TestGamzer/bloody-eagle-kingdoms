<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>ثغور الأندلس - القاعدة</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110b;--pan:#211b10;--ln:#6b5a2e;--gd:#e2b84a;--tx:#f1e8cf;--ol:#6f8f3a;--rd:#c0453a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;display:flex;flex-direction:column}
h3{font-family:Amiri,serif;color:var(--gd);margin:.2rem 0 .5rem;font-size:1.25rem}
#top{display:flex;gap:10px;padding:6px 10px;background:#0c0a06;border-bottom:1px solid var(--ln);font-size:.85rem;flex-wrap:wrap}
#top b{color:var(--gd)}
#mapbox{flex:1 1 52%;overflow:auto;position:relative;min-height:0;border-bottom:2px solid var(--ln)}
#map{position:relative;width:max(100%,920px);aspect-ratio:1672/941}
#map img,#map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pin{position:absolute;transform:translate(50%,-50%);min-width:26px;height:26px;padding:0 6px;border-radius:13px;border:2px solid #fff;color:#fff;font:700 .75rem Cairo;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 8px #000}
.pin.monster{background:#8b1d1d}.pin.rebel{background:#3a3a3a;border-color:#e2b84a}.pin.city{background:#2d5a1e}.pin.me{background:var(--gd);color:#000;border-color:#000;width:auto}
.pin.sel{outline:3px solid var(--gd)}
.dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--gd);border:2px solid #000;transform:translate(50%,-50%);pointer-events:none}
#panel{flex:1 1 48%;min-height:0;display:flex;flex-direction:column;background:var(--pan)}
#tabs{display:flex;border-bottom:1px solid var(--ln)}
#tabs button{flex:1;padding:9px 2px;background:none;border:0;color:var(--tx);font:700 .95rem Cairo;border-bottom:3px solid transparent}
#tabs button.on{color:var(--gd);border-color:var(--gd)}
#body{overflow:auto;padding:10px}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed #3d3320}
.btn{background:var(--ol);color:#fff;border:0;border-radius:6px;padding:9px 14px;font:700 .95rem Cairo;margin:4px 3px 4px 0;cursor:pointer}
.btn.gd{background:var(--gd);color:#1a1405}.btn.rd{background:var(--rd)}.btn:disabled{opacity:.4}
.bar{height:10px;background:#000;border-radius:5px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--gd)}
input,select{background:#0c0a06;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:7px;font:inherit;width:90px}
select{width:auto;max-width:100%}
.bad{color:#ff8a7a}.ok{color:#a7d36a}.mut{color:#a99d7c;font-size:.85rem}
#log{font-size:.82rem;color:#cdbf94;max-height:90px;overflow:auto}
</style></head><body>

<div id="panel"><div id="tabs"></div><div id="body"></div></div>
<script>
const CAP=30,MAX=35,N=['الذهب','الخشب','الحجر','القمح'],K=['g','w','s','f'],RW=[1,.8,.6,.5];
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.floor(n);
const dur=s=>{s=Math.ceil(s);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+'ي ':'')+(h?h+'س ':'')+(m?m+'د ':'')+(d?'':(s%60)+'ث')};
const S={lv:1,owner:false,res:{g:12500,w:8200,s:6750,f:5200},up:null,tab:'castle',sel:null,gear:0,mar:[],log:[],opt:0,
 tr:{inf:300,cav:150,arc:200,eng:60}};
const T={inf:{n:'مشاة الثغور',a:10,v:1.0},cav:{n:'فرسان الحمراء',a:18,v:2.2},arc:{n:'رماة الزلاقة',a:14,v:1.2},eng:{n:'مهندسو النار',a:24,v:.7}};
const GEAR=[['عتاد أساسي',0],['سيف دمشقي ودرع',.15],['راية الخلافة وخوذة مذهبة',.3],['عتاد أسطوري',.5]];
const OPT=[['عادي',1,0],['مسرّع 50% (+20% ذهب)',.5,.2],['مسرّع 75% (+50% ذهب)',.25,.5]];
const ME={x:514,y:670,name:'قلعتي - غرناطة'};
const TG=[
 {id:1,t:'monster',n:'تنين الجبل',x:640,y:430,p:9000},{id:2,t:'monster',n:'ذئب الغابة الأسود',x:300,y:260,p:3500},
 {id:3,t:'monster',n:'عملاق الصخر',x:760,y:790,p:15000},{id:4,t:'rebel',n:'متمردو الوادي',x:690,y:560,p:5000},
 {id:5,t:'rebel',n:'قطاع طرق الساحل',x:230,y:640,p:2500},{id:6,t:'rebel',n:'عصاة الشمال',x:560,y:170,p:12000},
 {id:7,t:'city',n:'إشبيلية',x:272,y:531,p:20000},{id:8,t:'city',n:'طليطلة',x:475,y:324,p:30000},
 {id:9,t:'city',n:'سرقسطة',x:706,y:228,p:26000},{id:10,t:'city',n:'بلعشية',x:807,y:468,p:18000}];
const cost=l=>Math.round(300*Math.pow(1.38,l)),time=l=>Math.round(20*Math.pow(1.4,l));
const log=m=>{S.log.unshift(m);S.log=S.log.slice(0,6)};
const can=c=>S.owner||K.every((k,i)=>S.res[k]>=c[i]);
const pay=c=>{if(!S.owner)K.forEach((k,i)=>S.res[k]-=c[i])};
function reqs(opt){const b=cost(S.lv+1);return RW.map((w,i)=>Math.round(b*w*(i==0?1+OPT[opt][2]:1)))}
function startUp(opt){const c=reqs(opt);if(!can(c))return;pay(c);S.up={to:S.lv+1,end:Date.now()+time(S.lv+1)*1000*OPT[opt][1]};log('بدأت ترقية القلعة إلى '+(S.lv+1))}
function finish(){S.lv=S.up.to;log('اكتملت ترقية القلعة إلى المستوى '+S.lv);S.up=null}
function dist(a,b){return Math.hypot((a.x-b.x)*1.78,a.y-b.y)}
function army(){const m={};Object.keys(T).forEach(k=>{const el=document.getElementById('s_'+k);m[k]=el?Math.min(S.tr[k],Math.max(0,+el.value||0)):0});return m}
function power(a){return Math.round(Object.keys(a).reduce((s,k)=>s+a[k]*T[k].a,0)*(1+GEAR[S.gear][1]))}
function sendArmy(){
 const a=army(),n=Object.values(a).reduce((x,y)=>x+y,0),t=S.sel;
 if(!n||!t){alert('اختر الهدف وحدد القوات');return}
 const sp=Math.min(...Object.keys(a).filter(k=>a[k]).map(k=>T[k].v)),d=dist(ME,t),go=d/sp*.5;
 Object.keys(a).forEach(k=>S.tr[k]-=a[k]);
 S.mar.push({a,t,start:Date.now(),go:go*1000,back:go*1000,pw:power(a),done:false});log('خرج الجيش نحو '+t.n)}
function resolve(m){
 const win=m.pw>=m.t.p,loss=win?.12:.45;m.loss=loss;m.win=win;
 Object.keys(m.a).forEach(k=>m.a[k]=Math.round(m.a[k]*(1-loss)));
 m.loot=win?Math.round(m.t.p*.4):0;
 log((win?'نصر على ':'هزيمة أمام ')+m.t.n+' - خسائر '+Math.round(loss*100)+'%'+(win?' - غنيمة '+fmt(m.loot):''));m.done=true}
function tick(){
 const now=Date.now();
 if(S.up&&now>=S.up.end)finish();
 S.mar=S.mar.filter(m=>{const e=now-m.start;
  if(!m.done&&e>=m.go)resolve(m);
  if(m.done&&e>=m.go+m.back){if(m.u){BRK.forEach(k=>m.u[k].forEach((q,i)=>S.units[k][i]+=q))}else Object.keys(m.a).forEach(k=>S.tr[k]+=m.a[k]);if(m.loot){S.res.g+=m.loot;S.res.w+=m.loot*.5}log('عاد الجيش من '+m.t.n);return false}return true});
 produce(Date.now());
 drawTop();drawMap();if(S.tab!='army'&&S.tab!='attack'||!document.activeElement||document.activeElement.tagName!='INPUT')drawBody(true)}
function drawTop(){document.getElementById('top').innerHTML=`<span>قلعتي <b>${S.lv}</b>/${CAP}</span>`+K.map((k,i)=>`<span>${N[i]} <b>${S.owner?'∞':fmt(S.res[k])}</b></span>`).join('')+(S.owner?'<span class="ok">المالك</span>':'')}
function drawMap(){
 const m=document.getElementById('map');m.querySelectorAll('.pin,.dot').forEach(e=>e.remove());
 let sv='';const now=Date.now();
 const add=(o,c,tx,sel)=>{const e=document.createElement('div');e.className='pin '+c+(sel?' sel':'');e.style.left=(o.x/10)+'%';e.style.top=o.y/10+'%';e.textContent=tx;e.title=o.n;e.onclick=()=>{S.sel=o;S.tab='attack';render()};m.appendChild(e)};

<script>

 return h+'</div>'}

 K.forEach((k,i)=>S.res[k]+=[3.2,1.8,1.2,.9][i]*s);S.b.forEach(p=>{if(p&&BD[p.t].r)S.res[BD[p.t].r]+=BD[p.t].rt*p.lv*s})}
function jobTick(){const n=Date.now();if(window.trainTick)trainTick(n);
 if(S.bj&&n>=S.bj.end){const j=S.bj;S.b[j.i]={t:j.t,lv:j.to};S.bj=null;log(BD[j.t].n+' أصبح مستوى '+j.to)}
 for(let i=DEAD.length-1;i>=0;i--)if(DEAD[i].until<=n){TG.push(DEAD[i].t);DEAD.splice(i,1)}}
function nextEv(){const c=[];(S.tq||[]).forEach(j=>c.push(j.end));if(S.up)c.push(S.up.end);if(S.bj)c.push(S.bj.end);S.mar.forEach(m=>c.push(m.start+(m.done?m.go+m.back:m.go)));DEAD.forEach(x=>c.push(x.until));return c.length?Math.min(...c):null}
function catchUp(now){const real=Date.now,r0={...S.res},old=S.log;let V=Math.min(S.lastP||now,now),k=0;S.log=[];
 Date.now=()=>V;capLeft=SAVE_CFG.offlineCapHours*3600e3;
 try{while(k++<1000){const e=nextEv();if(e==null||e>now)break;V=Math.max(V,e);tick();jobTick()}V=now;tick();jobTick()}
 finally{Date.now=real;capLeft=Infinity}
 const ev=S.log;S.log=[...ev,...old].slice(0,6);return{r0,ev}}
function hydrate(d){const k=d.kingdom;S.lv=k.lv;S.res=k.res;S.b=k.b;S.up=k.up;S.bj=k.bj;S.lastP=k.lastP;S.units=d.army.units;S.wdu=d.army.wounded;
 S.gear=d.player.gear||0;S.opt=d.player.opt||0;S.log=d.log||[];S.tq=(d.queues&&d.queues.train)||[];S.owner=false;S.sel=null;S.pl=null;
 S.mar=(d.marches||[]).map(x=>({...x,t:ALLT.find(t=>t.id==x.tid)}));DEAD.length=0;
 (d.world.dead||[]).forEach(x=>{const t=ALLT.find(t=>t.id==x.id);if(t){const i=TG.indexOf(t);if(i>-1)TG.splice(i,1);DEAD.push({t,until:x.until})}});
 ALLT.forEach(t=>{if(!TG.includes(t)&&!DEAD.some(x=>x.t==t))TG.push(t)})}
function welcome(d,r){const now=Date.now(),away=now-d.meta.savedAt;if(away<5000&&!r.ev.length)return;
 bar('wb','<b>أثناء غيابك ('+dur(Math.max(0,away)/1000)+'):</b> '+K.map((k,i)=>N[i]+' +'+fmt(S.res[k]-r.r0[k])).join(' | ')+(r.ev.length?'<br>'+r.ev.map(x=>'- '+x).join('<br>'):'')+'<br><span class=mut>إنتاج الغياب محدود بـ '+SAVE_CFG.offlineCapHours+' ساعة (إعداد تجريبي).</span>')}
function saveNow(force){if(HOLD&&!force)return false;
 try{const cur=ST_get(KEY);
  if(cur&&!force){const c=parse(cur);if(!c.err&&c.d.meta.rev!==BASE){conflict(c);return false}}
  const s=pack(snap());if(cur)ST_set(BAK,cur);ST_set(KEY,s);BASE++;LASTSAVE=Date.now();
  if(SERR){SERR=null;const e=document.getElementById('st');if(e)e.remove()}return true}
 catch(e){SERR=e;bar('st','<b>التقدم غير محفوظ:</b> التخزين غير متاح في هذا المتصفح. يمكنك نسخ نسخة احتياطية من تبويب «الحفظ».','#5a1f1f');return false}}

function overlay(h){let e=document.getElementById('cf');if(!e){e=document.createElement('div');e.id='cf';document.body.appendChild(e)}
 e.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:99;display:grid;place-items:center;padding:12px';
 e.innerHTML="<div style='background:#211b10;border:2px solid #e2b84a;border-radius:10px;padding:14px;max-width:520px'>"+h+'</div>'}

function useMine(){PSTORE&&(BASE=PSTORE.d.meta.rev);HOLD=false;document.getElementById('cf').remove();saveNow(true);render()}
function exportBk(){const t=pack(snap());const e=document.getElementById('bk');e.value=t;e.select();try{navigator.clipboard.writeText(t)}catch(x){}}
function procImport(txt){const m=document.getElementById('bkmsg');const o=parse(txt);if(o.err){m.innerHTML="<span class=bad>الملف مرفوض: "+o.err+'</span>';return}
 migrate(o.d);const e=check(o.d);if(e){m.innerHTML="<span class=bad>الملف مرفوض: "+e+'</span>';return}
 PEND=o;m.innerHTML="<div class=mut>الحالية: "+info(snap())+"</div><div class=mut>الملف: "+info(o.d)+"</div><button class='btn rd' onclick='applyImport()'>أؤكد الاستبدال بالملف</button>"}
async function dlBk(){const m=document.getElementById('bkmsg');try{const dl=window.claude&&claude.use?await claude.use('downloads'):null;
 if(!dl){m.innerHTML="<span class=bad>التنزيل غير متاح في هذا العرض. استخدم «إظهار النسخة الاحتياطية» وانسخ النص.</span>";return}
 await dl.save({filename:'andalus-backup-r'+BASE+'.json',data:pack(snap())});m.innerHTML="<span class=ok>تم تسليم الملف للحفظ.</span>"}
 catch(e){m.innerHTML="<span class=bad>لم يُحفظ الملف ("+((e&&e.code)||'خطأ')+"). استخدم النسخ النصي.</span>"}}

function applyImport(){if(!PEND)return;const d=PEND.d;let sr=BASE;try{const c=parse(ST_get(KEY));if(!c.err)sr=c.d.meta.rev}catch(e){}
 hydrate(d);BASE=sr;HOLD=false;const r=catchUp(Date.now());welcome(d,r);PEND=null;saveNow(true);render()}
function saveTabHTML(){return"<h3>الحفظ والنسخ الاحتياطي</h3><div class=row><span>آخر حفظ</span><b>"+(LASTSAVE?new Date(LASTSAVE).toLocaleTimeString('ar'):'-')+"</b></div><div class=row><span>رقم النسخة</span><b>"+BASE+"</b></div><div class=row><span>سقف إنتاج الغياب</span><b>"+SAVE_CFG.offlineCapHours+" ساعة</b></div><div class=row><span>حالة الحفظ</span><b class='"+(SERR||HOLD?'bad':'ok')+"'>"+(SERR?'التخزين غير متاح':HOLD?'متوقف حتى تختار':'يعمل')+"</b></div><button class='btn' onclick='saveNow();drawBody()'>احفظ الآن</button><button class='btn' onclick='exportBk()'>إظهار النسخة الاحتياطية</button><button class='btn gd' onclick='dlBk()'>تنزيل ملف النسخة الاحتياطية</button><br><textarea id='bk' rows='4' style='width:100%;background:#0c0a06;color:#f1e8cf' placeholder='الصق هنا نص نسخة احتياطية للاستعادة'></textarea><button class='btn' onclick='importBk()'>استعادة من النص</button> <input type='file' id='bkf' style='width:auto' onchange='importFile(this)'><div id='bkmsg'></div>"}
TABS.push(['save','الحفظ']);
const _db3=drawBody;drawBody=function(soft){if(soft&&S.tab=='owner'){const l=document.getElementById('log');if(l)l.innerHTML=S.log.map(x=>'<div>- '+x+'</div>').join('');return}_db3(soft);if(!soft&&S.tab=='save')document.getElementById('body').insertAdjacentHTML('afterbegin',saveTabHTML())};
const _su=startUp;startUp=function(o){if(S.up||S.lv>=CAP)return;return _su(o)};
['startUp','startB','ownB','healB','trainTr','sendArmy','ownerUp','skipM'].forEach(n=>{const f=window[n];window[n]=function(){const r=f.apply(this,arguments);saveNow();return r}});
window.bootSave=function(){let raw=null,o=null,note='';try{raw=ST_get(KEY)}catch(e){SERR=e}
 if(raw){o=parse(raw);if(!o.err){migrate(o.d);const m=check(o.d);if(m)o={err:m}}}
 if(o&&o.err){let rb=null,ob={err:'x'};try{rb=ST_get(BAK)}catch(e){}if(rb){ob=parse(rb);if(!ob.err){migrate(ob.d);const m=check(ob.d);if(m)ob={err:m}}}
  try{ST_set(COR,raw)}catch(e){}
  if(!ob.err){note='النسخة الرئيسية '+o.err+'، فاستُعيدت النسخة الاحتياطية الداخلية (قد تكون أقدم بحفظ واحد) وحُفظت المتضررة جانبًا.';o=ob}
  else{if(String(o.err).includes('أحدث')){HOLD=true;note='الحفظ من '+o.err+'. لن يُكتب شيء فوقه. حدّث اللعبة أو استورد نسخة.'}else note='تعذّرت قراءة الحفظ ('+o.err+'). حُفظ الملف جانبًا وبدأت لعبة جديدة.';o=null}}
 if(note)bar('nt',note,'#5a1f1f');
 if(o){hydrate(o.d);BASE=o.d.meta.rev;const now=Math.max(Date.now(),o.d.meta.savedAt),r=catchUp(now);welcome(o.d,r)}
 else{S.lastP=Date.now();BASE=0}
 SIG=[S.lv,S.up&&S.up.to,S.bj&&S.bj.to,S.mar.length,S.mar.map(m=>+m.done).join(),DEAD.length,(S.tq||[]).length].join('|');
 saveNow()};
setInterval(jobTick,250);
setInterval(()=>{const s=[S.lv,S.up&&S.up.to,S.bj&&S.bj.to,S.mar.length,S.mar.map(m=>+m.done).join(),DEAD.length,(S.tq||[]).length].join('|');if(s!==SIG){SIG=s;saveNow()}},1000);
setInterval(()=>saveNow(),SAVE_CFG.autosaveSec*1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow();else if(Date.now()-S.lastP>5000){catchUp(Date.now());render()}});
addEventListener('pagehide',()=>saveNow());
render();

<script>
const CAMPK={inf:'camp_inf',cav:'camp_cav',arc:'camp_arc',eng:'smith'},CAMPSET=new Set(Object.values(CAMPK)),BRN={inf:'المشاة',cav:'الفرسان',arc:'الرماة',eng:'آلات الحصار'};
const num=s=>parseInt(String(s).replace(/\D+/g,' ').trim().split(' ')[0]);
if(!S.tq)S.tq=[];
let TSEL={inf:1,cav:1,arc:1,eng:1},TQN=10;
const brOf=type=>Object.keys(CAMPK).find(k=>CAMPK[k]==type);
const maxBatch=br=>100*Math.max(1,lvOf(CAMPK[br]));
const ucost=(br,t,n)=>UNITS[br][t-1].cost.map(c=>Math.ceil(c*n));
const ROTV={5:['farm',4],6:['lumber',5],7:['camp_inf',6],12:['hosp',11],19:['smith',18],23:['camp_inf',22],27:['hosp',26],28:['hosp',27],30:['camp_inf',29]},CYC6=['camp_inf','hosp','camp_arc','smith','camp_cav',null];
function castleReqs(L){if(ROTV[L])return[ROTV[L]];if(L>=8&&CYC6[(L-8)%6])return[[CYC6[(L-8)%6],L-1]];return[]}
function bReqs(t,L){const r=[];
 if(t=='camp_inf'||t=='camp_arc'||t=='camp_cav'){if(L>5)r.push(['hosp',L-4]);if(L>6)r.push(['smith',L-6])}
 if(t=='smith'&&L>3)r.push(['camp_inf',L-3]);
 if(t=='hosp'&&L>5)r.push(['camp_inf',L-3]);
 return r.filter(x=>x[1]>=1)}
const reqLines=rs=>rs.map(([k,l])=>{const h=lvOf(k),ok=h>=l;return`<div class='row'><span>${BD[k].n} ${l}</span><b class='${ok?'ok':'bad'}'>${ok?'متحقق':'لديك '+h}</b></div>`}).join('')||`<div class='mut'>لا شروط مبانٍ أخرى لهذا المستوى</div>`;
const unmetTxt=rs=>rs.filter(([k,l])=>lvOf(k)<l).map(([k,l])=>BD[k].n+' '+l).join('، ');
function unlockInfo(br,t){const u=UNITS[br][t-1],ck=CAMPK[br],lc=lvOf(ck),need=num(u.camp),r=[];
 if(br=='eng'&&t>1)r.push('ورشة آلات الحصار (مبنى جديد يُبنى في مرحلة لاحقة)');
 else if(br=='eng'){if(lc<1)r.push('ورشة الحداد 1')}
 else if(lc<need)r.push(BD[ck].n+' '+need+(lc?' (لديك '+lc+')':' (غير مبني)'));
 if(S.lv<u.castle)r.push('قلعة '+u.castle+' (لديك '+S.lv+')');
 if(u.hosp>0&&lvOf('hosp')<u.hosp)r.push('مستشفى '+u.hosp+' (لديك '+lvOf('hosp')+')');
 if(u.smith>0&&lvOf('smith')<u.smith)r.push('حداد '+u.smith+' (لديك '+lvOf('smith')+')');
 return r}
function trainHTML(type){const br=brOf(type);let t=TSEL[br];
 const box=x=>`<div style='border:1px solid #6b5a2e;border-radius:8px;padding:8px;margin-bottom:8px;background:#17120a'>${x}</div>`;
 let h=`<b>تدريب ${BRN[br]}</b> <span class='mut'>دفعة واحدة حتى ${maxBatch(br)} · طوابير حتى 5</span>`;
 UNITS[br].forEach(u=>{const lk=unlockInfo(br,u.t),sel=u.t==t;
  h+=`<div class='row' style='cursor:pointer;flex-direction:column;${sel?'background:#2b2410;':''}' onclick='selT("${br}",${u.t})'><div><b>T${u.t} ${u.n}</b> <span class='mut'>${u.w} · ${u.a}</span></div><div class='mut'>هجوم ${u.atk} · دفاع ${u.def} · صحة ${u.hp} · سرعة ${u.spd} · حمولة ${u.load} · قوة ${u.pw} · ${u.cost.map((c,i)=>N[i]+' '+c).filter((x,i)=>u.cost[i]>0).join(' | ')} · ${u.time}ث للوحدة</div>${lk.length?`<div class='bad'>مقفلة: ${lk.join('، ')}</div>`:`<div class='ok'>متاحة${S.units[br][u.t-1]?' · لديك '+S.units[br][u.t-1]:''}</div>`}<div class='mut'>المظهر: ${u.v}</div></div>`});
 const u=UNITS[br][t-1],lk=unlockInfo(br,t);
 h+=`<div style='margin-top:8px'><b>T${t} ${u.n}</b><div class='row'><span>العدد</span><input id='tqn' type='number' min='1' max='${maxBatch(br)}' value='${TQN}' oninput='TQN=Math.floor(+this.value||0);updTT("${br}")'></div><div class='row'><span>التكلفة الإجمالية</span><b id='tqc'></b></div><div class='row'><span>مدة التدريب</span><b id='tqd'></b></div><button class='btn' ${lk.length?'disabled':''} onclick='startTrain("${br}")'>ابدأ التدريب</button>${S.owner&&S.tq.length?`<button class='btn gd' onclick='S.tq.forEach(j=>j.end=Date.now());saveNow()'>إنهاء كل الطوابير</button>`:''}</div>`;
 const q=S.tq.filter(j=>j.br==br);
 h+=`<div style='margin-top:8px'><b>طابور التدريب (${q.length})</b>`+(q.length?q.map(j=>`<div class='row'><span>${j.n} × T${j.t} ${UNITS[br][j.t-1].n}</span><span><b class='tqt' data-end='${j.end}'>${dur(Math.max(0,j.end-Date.now())/1000)}</b> <button class='btn rd' style='padding:3px 8px' onclick='cancelTrain("${j.id}")'>إلغاء (استرجاع 50%)</button></span></div>`).join(''):`<div class='mut'>لا يوجد تدريب جارٍ</div>`)+`</div>`;
 return box(h)}

 e.textContent=c.map((x,i)=>N[i]+' '+fmt(x)).filter((x,i)=>c[i]>0).join(' | ')+(S.owner||K.every((k,i)=>S.res[k]>=c[i])?'':' (موارد غير كافية)');e.className=S.owner||K.every((k,i)=>S.res[k]>=c[i])?'ok':'bad';d.textContent=dur(UNITS[br][t-1].time*n)}
function selT(br,t){TSEL[br]=t;drawBody()}

 if(unlockInfo(br,t).length||n<1||n>maxBatch(br)){alert('اختر طبقة متاحة وعددًا بين 1 و'+maxBatch(br));return}

 const c=ucost(br,t,n);if(!can(c)){alert('الموارد غير كافية');return}
 pay(c);const last=Math.max(Date.now(),...S.tq.filter(j=>j.br==br).map(j=>j.end));
 S.tq.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),br,t,n,start:last,end:Math.round(last+UNITS[br][t-1].time*n*1000),paid:c});
 log('بدأ تدريب '+n+' × '+UNITS[br][t-1].n);saveNow();drawBody()}

 S.tq=S.tq.filter(x=>x.id!=id);rechain(j.br);log('أُلغي تدريب '+j.n+' × '+UNITS[j.br][j.t-1].n+' واسترُجع 50% من الموارد');saveNow();drawBody()}
function trainTick(now){let ch=false;S.tq.filter(j=>j.end<=now).sort((a,b)=>a.end-b.end).forEach(j=>{S.units[j.br][j.t-1]+=j.n;log('اكتمل تدريب '+j.n+' × '+UNITS[j.br][j.t-1].n);ch=true});
 if(ch){S.tq=S.tq.filter(j=>j.end>now);if(document.getElementById('body')&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)))drawBody()}}
setInterval(()=>document.querySelectorAll('.tqt').forEach(e=>{e.textContent=dur(Math.max(0,+e.dataset.end-Date.now())/1000)}),1000);
// hospital
const hospCap=()=>150*lvOf('hosp'),wdTotal=()=>BRK.reduce((s,k)=>s+S.wdu[k].reduce((a,b)=>a+b,0),0);
const hcost=(br,i,n)=>ucost(br,i+1,n).map(c=>Math.ceil(c*.25));

healB=healAll;
function hospHTML(){let h=`<b>المستشفى</b><div class='row'><span>الأسرّة المشغولة / السعة</span><b class='${wdTotal()>hospCap()?'bad':''}'>${wdTotal()} / ${hospCap()}</b></div><div class='mut'>الزائدون عن السعة يموتون بعد المعارك. العلاج فوري حاليًا بتكلفة 25% من تدريب الوحدة (وقت العلاج وأولوياته لاحقًا).</div>`;let any=false;
 BRK.forEach(k=>S.wdu[k].forEach((n,i)=>{if(n>0){any=true;const c=hcost(k,i,n);h+=`<div class='row'><span>${n} × T${i+1} ${UNITS[k][i].n}</span><button class='btn' onclick='healU("${k}",${i},${n})'>عالج (${c.map((x,q)=>N[q]+' '+fmt(x)).filter((x,q)=>c[q]>0).join(' | ')})</button></div>`}}));
 return`<div style='border:1px solid #6b5a2e;border-radius:8px;padding:8px;margin-bottom:8px;background:#17120a'>${h}${any?`<button class='btn gd' onclick='healAll()'>عالج الجميع</button>`:`<div class='mut'>لا جرحى الآن</div>`}</div>`}
// plot panel
const _ph2=plotHTML;
plotHTML=function(){const i=S.pl;let pre='';
 if(i>0&&S.b[i]&&!(S.bj&&S.bj.i==i)){const p=S.b[i];
  if(CAMPSET.has(p.t))pre+=trainHTML(p.t);if(p.t=='hosp')pre+=hospHTML();
  const rs=bReqs(p.t,p.lv+1);if(p.lv<S.lv)pre+=`<div style='border:1px solid #6b5a2e;border-radius:8px;padding:8px;margin-bottom:8px;background:#17120a'><b>شروط ترقية ${BD[p.t].n} إلى ${p.lv+1}</b>${reqLines(rs)}</div>`}
 return pre+_ph2()};
// requirements gating
const _su2=startUp;startUp=function(o){const un=unmetTxt(castleReqs(S.lv+1));if(!S.up&&S.lv<CAP&&un){alert('متطلبات القلعة غير مكتملة: '+un);return}const r=_su2(o);saveNow();return r};
const _ou2=ownerUp;ownerUp=function(){if(!S.up&&S.lv<CAP){const un=unmetTxt(castleReqs(S.lv+1));if(un){alert('حتى المالك: متطلبات القلعة غير مكتملة: '+un);return}}return _ou2()};
const _sb2=startB;startB=function(i,k){const t=TY[k],lv=(S.b[i]?S.b[i].lv:0)+1,un=unmetTxt(bReqs(t,lv));if(!S.bj&&lv<=S.lv&&un){alert('متطلبات '+BD[t].n+' '+lv+': '+un);return}return _sb2(i,k)};
// inventory + attack by tier
function invHTML(){let h=`<h3>مخزون الجيش</h3>`;BRK.forEach(k=>{const rows=UNITS[k].map((u,i)=>{const a=S.units[k][i],w=S.wdu[k][i],q=S.tq.filter(j=>j.br==k&&j.t==i+1).reduce((s,j)=>s+j.n,0),m=S.mar.reduce((s,x)=>s+(x.u?x.u[k][i]:(i==0?(x.a[k]||0):0)),0);
  return(a||w||q||m)?`<div class='row'><span>T${i+1} ${u.n}</span><span>متاح <b>${a}</b> · تدريب <b>${q}</b> · جرحى <b>${w}</b> · في مسيرة <b>${m}</b></span></div>`:''}).join('');
  h+=`<div class='mut' style='margin-top:6px'>${BRN[k]}</div>`+(rows||`<div class='mut'>لا وحدات. ادخل ${BD[CAMPK[k]].n} من تبويب «قلعتي» للتدريب.</div>`)});return h}
function readU(){const u={};BRK.forEach(k=>{u[k]=UNITS[k].map((x,i)=>{const e=document.getElementById('su_'+k+'_'+i);return e?Math.min(S.units[k][i],Math.max(0,Math.floor(+e.value||0))):0})});return u}
army=function(){const u=readU(),a={};BRK.forEach(k=>a[k]=u[k].reduce((s,n)=>s+n,0));return a};
upd=function(){const mp=document.getElementById('mp');if(!mp||!S.sel)return;const u=readU();let pw=0,sp=Infinity,tot=0;BRK.forEach(k=>u[k].forEach((n,i)=>{if(n){pw+=n*UNITS[k][i].pw;sp=Math.min(sp,UNITS[k][i].spd);tot+=n}}));
 pw=Math.round(pw*(1+GEAR[S.gear][1]));mp.textContent=fmt(pw);mp.className=pw>=S.sel.p?'ok':'bad';if(tot){const s=dist(ME,S.sel)/sp*.5;document.getElementById('tg').textContent=dur(s);document.getElementById('tb').textContent=dur(s)}};
sendArmy=function(){const u=readU(),t=S.sel;let tot=0,pw=0,sp=Infinity;BRK.forEach(k=>u[k].forEach((n,i)=>{if(n){tot+=n;pw+=n*UNITS[k][i].pw;sp=Math.min(sp,UNITS[k][i].spd)}}));
 if(!tot||!t){alert('اختر الهدف وحدد القوات');return}pw=Math.round(pw*(1+GEAR[S.gear][1]));const go=dist(ME,t)/sp*.5,a={};
 BRK.forEach(k=>{a[k]=u[k].reduce((s,n)=>s+n,0);u[k].forEach((n,i)=>S.units[k][i]-=n)});
 S.mar.push({a,u,t,start:Date.now(),go:go*1000,back:go*1000,pw,done:false});log('خرج الجيش نحو '+t.n);saveNow()};
const _r2=resolve;resolve=function(m){if(!m.u)return _r2(m);
 const win=m.pw>=m.t.p,loss=win?.12:.45;m.win=win;m.loss=loss;m.loot=win?Math.round(m.t.p*.4):0;let room=hospCap()-wdTotal(),lostN=0,woundN=0;
 BRK.forEach(k=>{m.u[k]=m.u[k].map((n,i)=>{const s=Math.round(n*(1-loss)),lost=n-s,w=Math.max(0,Math.min(room,Math.floor(lost*.5)));if(w>0){S.wdu[k][i]+=w;room-=w;woundN+=w}lostN+=lost;return s});m.a[k]=m.u[k].reduce((a,b)=>a+b,0)});
 log((win?'نصر على ':'هزيمة أمام ')+m.t.n+' - خسائر '+lostN+' (جرحى '+woundN+')'+(win?' - غنيمة '+fmt(m.loot):''));m.done=true;
 if(m.t.t=='monster'&&win){const i=TG.indexOf(m.t);if(i>-1){TG.splice(i,1);DEAD.push({t:m.t,until:Date.now()+60000})}}};
// tab hooks
const _db4=drawBody;drawBody=function(soft){_db4(soft);if(soft)return;const b=document.getElementById('body');
 if(S.tab=='army'){b.querySelectorAll("button[onclick^='trainTr']").forEach(x=>x.remove());b.insertAdjacentHTML('afterbegin',invHTML())}
 if(S.tab=='attack'&&S.sel){const mp=document.getElementById('mp');if(mp){b.querySelectorAll("input[id^='s_']").forEach(e=>e.parentNode.remove());
  let h='';BRK.forEach(k=>UNITS[k].forEach((u,i)=>{const n=S.units[k][i];if(n>0)h+=`<div class='row'><span>T${i+1} ${u.n} (متاح ${n})</span><input id='su_${k}_${i}' type='number' min='0' max='${n}' value='0' oninput='upd()'></div>`}));
  mp.parentNode.insertAdjacentHTML('beforebegin',h||`<div class='bad'>لا وحدات متاحة. دربها من المعسكرات.</div>`);upd()}}
 if(S.tab=='castle'){const h3=[...b.querySelectorAll('h3')].find(x=>x.textContent.includes('قلعتي الخاصة'));if(h3&&S.lv<CAP)h3.insertAdjacentHTML('afterend',`<div style='border:1px solid #6b5a2e;border-radius:8px;padding:8px;margin:6px 0;background:#17120a'><b>مبانٍ مطلوبة لترقية القلعة إلى ${S.lv+1}</b>${reqLines(castleReqs(S.lv+1))}</div>`)}
 if(S.tab=='castle'&&S.pl!=null&&S.pl>0&&S.b[S.pl]&&CAMPSET.has(S.b[S.pl].t))updTT(brOf(S.b[S.pl].t))};
bootSave();
render();
